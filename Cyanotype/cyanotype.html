<!DOCTYPE HTML>
<html>
<head>
<title>cyanotype design</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="cyanotype design">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="cyanotype.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
   
</head>
<body>
    <h1>Design your own! Drag flowers/plants onto the cyanotype.</h1>
<div class="fixed-section">
    <div class="draggable-area">
        <!-- draggable flower/plant images -->
        <img class="img player" src="cyanotype/cyanotype.png" alt="cyanotype base">
        <img class="img object draggable" src="cyanotype/flower1.png" alt="flower" style="left: 40px; top: 40px; width: 130px;">
        <img class="img object draggable" src="cyanotype/flower2.png" alt="flower" style="left: 170px; top: 140px; width: 100px;">
        <img class="img object draggable" src="cyanotype/flower3.png" alt="flower" style="left: 40px; top: 240px; width: 100px;">
        <img class="img object draggable" src="cyanotype/flower4.png" alt="flower" style="left: 180px; top: 340px; width: 130px;">
        <img class="img object draggable" src="cyanotype/flower5.png" alt="flower" style="left: 40px; top: 440px; width: 150px;">
        <img class="img object draggable" src="cyanotype/flower6.png" alt="flower" style="left: 180px; top: 540px; width: 180px;">
        <img class="img object draggable" src="cyanotype/flower7.png" alt="flower" style="right: 40px; top: 40px; width: 130px;">
        <img class="img object draggable" src="cyanotype/flower8.png" alt="flower" style="right: 190px; top: 140px; width: 130px;">
        <img class="img object draggable" src="cyanotype/flower9.png" alt="flower" style="right: 40px; top: 270px; width: 100px;">
        <img class="img object draggable" src="cyanotype/plant1.png" alt="flower" style="right: 180px; top: 340px; width: 100px;">
        <img class="img object draggable" src="cyanotype/plant2.png" alt="flower" style="right: 40px; top: 440px; width: 130px;">
        <img class="img object draggable" src="cyanotype/plant3.png" alt="flower" style="right: 180px; top: 540px; width: 130px;">
    </div>
</div>
    <div class="button-container" style="background-color: white;">
        <button onclick="document.location='questions.html'">collaborate</button>
    </div>

    <script src="cyanotype.js"></script>

</body>
</html>
